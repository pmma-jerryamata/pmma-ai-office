<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The PMMA pixel-art IT office and personal task board.">
  <title>PMMA IT Office</title>
  <style>
    :root {
      color-scheme: light;
      --background: #e9f4fb;
      --panel: #fffdf9;
      --surface: #f5f9fc;
      --border: #b7c8d3;
      --text: #243b4d;
      --muted: #4c6274;
      --blue: #195c83;
      --blue-wash: #dcf0fa;
      --brown: #754b32;
      --wood-wash: #f4e5d4;
      font: 16px/1.45 system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--text); }
    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    button, input, select {
      min-height: 42px;
      min-width: 0;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: var(--surface);
    }
    :is(button, input, select):focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
    button:hover { border-color: var(--blue); background: var(--blue-wash); }
    [hidden] { display: none !important; }
    h1, h2, p { margin: 0; }
    .shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px clamp(14px, 3vw, 34px);
      border-bottom: 3px solid #d0a986;
      background: var(--panel);
    }
    .brand { display: flex; gap: 12px; align-items: center; }
    .brand-mark {
      display: grid;
      place-items: center;
      flex: 0 0 42px;
      height: 42px;
      border: 1px solid #bb8d6b;
      border-radius: 10px;
      color: var(--brown);
      background: var(--wood-wash);
      font: 800 20px/1 ui-monospace, monospace;
    }
    .brand p { color: var(--muted); font-size: .875rem; }
    .brand h1 { font: 800 clamp(1.25rem, 2.5vw, 1.65rem)/1.15 system-ui, sans-serif; letter-spacing: -.035em; }
    .topbar button { font-size: .875rem; white-space: nowrap; }
    .workspace { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 365px); }
    .office {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: clamp(12px, 2vw, 26px);
      padding-block: clamp(10px, 1.4vw, 22px);
      background: radial-gradient(ellipse at 45% 22%, #f8fcff 0%, #dfedf7 85%);
    }
    .office-inner { width: 100%; max-width: 1100px; }
    .office-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      margin-bottom: 12px;
    }
    .office-heading button { font-size: .875rem; }
    .office-heading h2, .tasks h2 {
      font: 800 clamp(1.4rem, 2.6vw, 1.8rem)/1.12 system-ui, sans-serif;
      letter-spacing: -.04em;
      color: var(--text);
    }
    .office-heading p, .task-note, .empty { margin-top: 4px; color: var(--muted); font-size: .875rem; }
    .floor {
      position: relative;
      border: 2px solid #805838;
      border-radius: 12px;
      overflow: hidden;
      container-type: inline-size;
      background: #e0b78c;
      box-shadow: 0 9px 20px #4e53662e;
    }
    canvas { display: block; image-rendering: pixelated; }
    .floor canvas { width: 100%; height: auto; }
    .zone-label {
      position: absolute;
      left: var(--x);
      top: var(--y);
      max-width: 28%;
      transform: translate(-50%, -50%);
      padding: 3px clamp(4px, 1.2cqw, 7px);
      border: 1px solid #987358;
      border-radius: 4px;
      background: #fff5e6;
      color: #513521;
      font: 750 clamp(.75rem, 2.3cqw, .9rem)/1.15 system-ui, sans-serif;
      white-space: nowrap;
      pointer-events: none;
    }
    .station {
      position: absolute;
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -100%);
      width: max(46px, 16%);
      height: 23%;
      min-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .station:focus-visible { outline-offset: -3px; }
    .station:hover { background: transparent; }
    .station span {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      padding: 2px 8px;
      border: 1px solid #678ca5;
      border-radius: 5px;
      color: var(--text);
      background: #f8fcff;
      white-space: nowrap;
      font: 750 clamp(.75rem, 2.45cqw, 1rem)/1.25 system-ui, sans-serif;
    }
    .station:is(:hover, [aria-pressed="true"]) span,
    .roster button:is(:hover, [aria-pressed="true"]) {
      border-color: var(--blue);
      color: #164764;
      background: var(--blue-wash);
    }
    .roster { display: grid; grid-template-columns: repeat(auto-fit, minmax(66px, 1fr)); gap: 6px; margin: 12px 0; }
    .roster button { font: 750 .9375rem/1.15 system-ui, sans-serif; }
    .profile {
      min-height: 82px;
      display: grid;
      grid-template-columns: 64px 1fr;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-left: 4px solid #b8835e;
      border-radius: 10px;
      background: var(--panel);
    }
    .profile canvas { width: 64px; border-radius: 5px; }
    .profile-name { font-size: 1.0625rem; font-weight: 800; color: var(--brown); }
    .profile-role { line-height: 1.25; }
    .profile-focus { color: var(--muted); font-size: .875rem; }

    .tasks {
      align-self: stretch;
      min-width: 0;
      padding: 24px clamp(17px, 2vw, 25px);
      border-left: 1px solid var(--border);
      background: var(--panel);
    }
    .tasks-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .task-count {
      padding: 4px 9px;
      border-radius: 6px;
      background: var(--blue-wash);
      color: #164764;
      font: 700 .875rem/1.3 system-ui, sans-serif;
    }
    .task-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 10px 8px;
      margin: 20px 0 15px;
    }
    .task-form label, .task-filter { display: grid; gap: 4px; font-size: .875rem; }
    .task-form label:first-child { grid-column: 1 / -1; }
    .task-form input, .task-form select, .task-filter select { width: 100%; }
    .task-form button { font-weight: 750; background: var(--blue); border-color: var(--blue); color: #fff; }
    .task-form button:hover { background: #124e70; }
    .task-filter { border-top: 1px solid var(--border); padding-top: 13px; }
    .task-list { display: grid; gap: 8px; padding: 0; margin: 12px 0 0; list-style: none; }
    .task {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 8px;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .task-title { font-weight: 650; overflow-wrap: anywhere; }
    .task-owner { font-size: .875rem; color: var(--muted); }
    .task select { background: var(--panel); font-size: .875rem; }
    .task-remove { justify-self: end; grid-column: 2; grid-row: 1; font-size: .875rem; }
    .task select { grid-column: 1 / -1; grid-row: 2; }
    .task-status-message { color: #8c3f20; margin-top: 8px; font-size: .875rem; }

    @media (min-width: 851px) {
      .shell { height: 100vh; height: 100dvh; }
      .workspace { min-height: 0; }
      .office, .tasks { overflow-y: auto; }
      .office { align-items: safe center; }
      .office-inner { max-width: min(1180px, max(420px, calc((100dvh - 341px) * 1.58))); }
    }
    @media (max-width: 850px) {
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .tasks { border-left: 0; border-top: 1px solid var(--border); }
    }
    @media (max-width: 380px) {
      .brand-mark { display: none; }
      .topbar button { padding-inline: 7px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <div>
          <h1>PMMA IT Office</h1>
          <p>Web development &amp; IT operations</p>
        </div>
      </div>
      <button id="fullscreen" type="button" hidden>Full screen</button>
    </header>

    <main class="workspace">
      <section class="office" aria-labelledby="floor-heading">
        <div id="pixel-it-office" class="office-inner">
          <div class="office-heading">
            <div>
              <h2 id="floor-heading">Office floor</h2>
              <p>Select a teammate to see their role.</p>
            </div>
            <button id="office-motion" type="button" hidden>Pause motion</button>
          </div>
          <div class="floor">
            <canvas id="pixel-office-floor" width="360" height="228" role="img"
              aria-label="Pixel-art IT office with a cybersecurity desk, two development desks, a repair bench, and a network lab"></canvas>
            <span class="zone-label" style="--x: 19.7%; --y: 27.6%">Security</span>
            <span class="zone-label" style="--x: 49.2%; --y: 27.6%">Web dev</span>
            <span class="zone-label" style="--x: 78.3%; --y: 27.6%">Systems</span>
            <span class="zone-label" style="--x: 27.2%; --y: 67.5%">Tech support</span>
            <span class="zone-label" style="--x: 72.2%; --y: 67.5%">Network lab</span>
          </div>
          <div class="roster" role="group" aria-label="Office team"></div>
          <div class="profile" aria-live="polite" aria-atomic="true">
            <canvas id="pixel-office-portrait" width="40" height="40" aria-hidden="true"></canvas>
            <div>
              <p class="profile-name"></p>
              <p class="profile-role"></p>
              <p class="profile-focus"></p>
            </div>
          </div>
        </div>
      </section>

      <aside class="tasks" aria-labelledby="tasks-heading">
        <div class="tasks-heading">
          <h2 id="tasks-heading">Tasks</h2>
          <p id="task-count" class="task-count" aria-live="polite"></p>
        </div>
        <p class="task-note">Tasks are saved in this browser.</p>
        <form id="task-form" class="task-form">
          <label>Task
            <input id="task-title" maxlength="120" required placeholder="What needs doing?">
          </label>
          <label>Assignee
            <select id="task-owner"></select>
          </label>
          <button type="submit">Add task</button>
        </form>
        <label class="task-filter">Show tasks
          <select id="task-filter">
            <option value="all">All statuses</option>
            <option value="todo">To do</option>
            <option value="doing">In progress</option>
            <option value="done">Done</option>
          </select>
        </label>
        <p id="task-message" class="task-status-message" role="status" hidden></p>
        <p id="task-empty" class="empty"></p>
        <ul id="task-list" class="task-list"></ul>
      </aside>
    </main>
  </div>

  <script>
(() => {
  const office = document.getElementById('pixel-it-office');
  const floor = office.querySelector('.floor');
  const roster = office.querySelector('.roster');
  const floorCanvas = document.getElementById('pixel-office-floor');
  const scene = floorCanvas.getContext('2d');
  const room = document.createElement('canvas');
  room.width = floorCanvas.width;
  room.height = floorCanvas.height;
  const map = room.getContext('2d');
  const portrait = document.getElementById('pixel-office-portrait').getContext('2d');
  const profile = {
    name: office.querySelector('.profile-name'),
    role: office.querySelector('.profile-role'),
    focus: office.querySelector('.profile-focus')
  };
  const team = [
    { name: 'Harold', role: 'System & Apps Administrator', focus: 'Cybersecurity · Team Lead',
      x: 71, y: 97, color: '#86ebc3', face: {
        tones: ['#be8467', '#e8ad8d', '#f5c3a1'],
        rows: [
          '.....OOOOOOO.....', '...OOHHHHHHHOO...', '..OHHhhhHHHHHHO..',
          '..OHHHHHHHHHHHO..', '.OHHHssHHsHHHHHO.', '.OHHssSSSSssHHHO.',
          '.OHHssSSSSSssHHO.', '.OdHsBBsssBBsHdO.', '.OdHsEsssssEsHdO.',
          '.OdsSSSsnSSSsdO..', '..OdsLSSnSSLsdO..', '..OdsSssssSsdO...',
          '...OdsMWWMMdO....', '....OdsWWsdO.....', '.....OddddO......',
          '......OOOO.......'
        ]
      } },
    { name: 'Jerry', role: 'Web App Developer', focus: 'Developer',
      x: 177, y: 97, color: '#cfa6ff', face: {
        tones: ['#ad7356', '#da9d79', '#efb891'],
        rows: [
          '....OOOOOOO......', '...OHHhhhHHOO....', '..OHHhhHHHHHHO...',
          '.OHHhHHHHHHHHHO..', '.OHHHHssHHHHHHO..', '.OHHssSSSssHHHO..',
          '.OdHsSSSSSSsHdO..', '.OdHBBSssBBsHdO..', '.OdsEsSSSEsSsdO..',
          '.OdsLSSnSSSLsdO..', '..OsLSSnSSSLsO...', '..OdSSsnsSSsdO...',
          '...OdSSmMssdO....', '...OdSSSSssdO....', '....OddddddO.....',
          '.....OOOOOO......'
        ]
      } },
    { name: 'Marlon', role: 'Web & Systems Administrator', focus: 'Developer',
      x: 282, y: 97, color: '#81d8ff', face: {
        tones: ['#9b604e', '#d89773', '#eeb48c'],
        rows: [
          '.....OOOOOO......', '...OOHHHHHHO.....', '..OHHhHHhhhHO....',
          '.OHHhHshhHHHHO...', '.OHHHssSHhHHHHO..', '.OHHsSSSSSHHHHO..',
          '.OdHsSSSSssHHHO..', '.OdHBBSssBBsHdO..', '.OdHsEsSSsEsHdO..',
          '..OdsSSnSSSsdO...', '..OdsLSnSSLsdO...', '...OdsFFFFsdO....',
          '...OdsMWWMdO.....', '....OdsFFsdO.....', '.....OddddO......',
          '......OOOO.......'
        ]
      } },
    { name: 'JR', role: 'Computer Technician', focus: 'Tech Support',
      x: 98, y: 183, color: '#ffc181', face: {
        tones: ['#a86954', '#d89b7e', '#ecae8b'],
        rows: [
          '.....OOOOOO......', '...OOHHHHHHOO....', '..OHHhhHHHHHHO...',
          '..OHHHsssHHHHO...', '..OHssSSSSsHHO...', '.OdHsSSSSSSsHdO..',
          '.OdHsSSSSSSsHdO..', '.OdsBBssssBBsdO..', '.OdsEsSSSsEsdO...',
          '.OdsLSSnnSSLsdO..', '..OdsSSnnSSsdO...', '..OdSSSssSSdO....',
          '...OdsmmmssdO....', '...OdsSSSssdO....', '....OddddddO.....',
          '.....OOOOOO......'
        ]
      } },
    { name: 'Flong', role: 'Network Administrator', focus: 'Network Support',
      x: 260, y: 183, color: '#fff18a' }
  ];
  const walks = [
    [[0, 0], [0, 12], [25, 12], [20, 6], [0, 0]],
    [[0, 0], [0, 12], [-26, 12], [-20, 6], [0, 0]],
    [[0, 0], [0, 12], [23, 12], [18, 6], [0, 0]],
    [[0, 0], [0, 9], [27, 9], [23, 0], [0, 0]],
    [[0, 0], [0, 9], [-20, 9], [-15, 0], [0, 0]]
  ];
  const controls = [];
  const stations = new Map();
  let selected = team[0];
  let elapsed = 0;

  function box(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  function makeFace(face) {
    const [shadow, skin, light] = face.tones;
    const colors = {
      O: '#151724', H: '#191b24', h: '#39414b',
      s: shadow, d: shadow, S: skin, L: light,
      B: '#4d3030', E: '#222028', n: shadow,
      M: '#713e3c', m: '#94584f', W: '#fff1dc', F: '#4b302d'
    };
    const image = document.createElement('canvas');
    image.width = 17;
    image.height = face.rows.length;
    const art = image.getContext('2d');
    face.rows.forEach((row, y) => {
      Array.from(row).forEach((key, x) => {
        if (colors[key]) box(art, x, y, 1, 1, colors[key]);
      });
    });
    return image;
  }

  const faces = new Map(team.filter(({ face }) => face).map((member) => [member, makeFace(member.face)]));

  function drawFace(ctx, x, y, member) {
    const face = faces.get(member);
    if (face) {
      ctx.drawImage(face, x - 8, y - 8);
      return;
    }
    box(ctx, x - 6, y - 6, 13, 15, '#141824');
    box(ctx, x - 5, y - 4, 11, 12, '#b67b5d');
    box(ctx, x - 5, y - 5, 11, 4, '#29212b');
    box(ctx, x - 5, y - 2, 2, 4, '#29212b');
    box(ctx, x - 2, y + 2, 1, 2, '#252437');
    box(ctx, x + 3, y + 2, 1, 2, '#252437');
    box(ctx, x - 7, y - 5, 14, 2, '#56638d');
    box(ctx, x + 5, y - 2, 3, 7, '#56638d');
  }

  function sprite(ctx, x, y, member, stride = 0) {
    box(ctx, x - 10, y + 19, 21, 3, '#12202d');
    y -= Math.abs(stride);
    box(ctx, x - 8, y + 7, 17, 12, '#101520');
    box(ctx, x - 7, y + 8, 15, 8, member.color);
    box(ctx, x - 4, y + 16, 8, 5, '#23314f');
    box(ctx, x - 5 - stride, y + 20 + stride, 4, 2, '#101520');
    box(ctx, x + 2 + stride, y + 20 - stride, 4, 2, '#101520');
    drawFace(ctx, x, y, member);
  }

  function drawPortrait(member) {
    const { width, height } = portrait.canvas;
    box(portrait, 0, 0, width, height, '#cee7f6');
    box(portrait, 0, height - 2, width, 2, member.color);
    portrait.imageSmoothingEnabled = false;
    portrait.save();
    portrait.scale(2, 2);
    box(portrait, 2, 17, 16, 2, member.color);
    box(portrait, 7, 16, 6, 3, '#edf4ff');
    drawFace(portrait, 10, 9, member);
    portrait.restore();
  }

  function windowPane(x) {
    box(map, x - 2, 15, 51, 30, '#779db6');
    box(map, x, 16, 47, 25, '#fff2e1');
    box(map, x + 2, 18, 43, 21, '#a7d9f2');
    box(map, x + 5, 24, 12, 2, '#effaff');
    box(map, x + 9, 22, 5, 2, '#effaff');
    box(map, x + 32, 24, 9, 2, '#effaff');
    box(map, x + 4, 34, 14, 5, '#74abc7');
    box(map, x + 28, 31, 8, 8, '#83b6ce');
    box(map, x + 36, 35, 8, 4, '#74abc7');
    box(map, x + 22, 17, 2, 24, '#fff2e1');
    box(map, x - 2, 41, 51, 3, '#bd8c66');
  }

  function rug(x, y, width, height) {
    box(map, x + 1, y + 2, width, height, '#ae8d74');
    box(map, x, y, width, height, '#6595b2');
    box(map, x + 2, y + 2, width - 4, height - 4, '#b7d9eb');
    box(map, x + 4, y + 4, width - 8, height - 8, '#cce5f2');
  }

  function desk(x, y, width) {
    box(map, x + 3, y + 3, width, 22, '#9bb5c1');
    box(map, x, y, width, 18, '#784e36');
    box(map, x + 1, y + 1, width - 2, 2, '#e5b68b');
    box(map, x + 2, y + 3, width - 4, 11, '#bd855b');
    box(map, x + 2, y + 11, width - 4, 1, '#d0986b');
    box(map, x, y + 15, width, 4, '#916043');
    box(map, x + 3, y + 18, 4, 6, '#64442f');
    box(map, x + width - 7, y + 18, 4, 6, '#64442f');
  }

  function monitor(x, y, color) {
    box(map, x, y, 23, 15, '#162033');
    box(map, x + 2, y + 2, 19, 10, '#243e55');
    box(map, x + 4, y + 4, 6, 1, color);
    box(map, x + 7, y + 6, 10, 1, '#9cb9c9');
    box(map, x + 7, y + 8, 7, 1, color);
    box(map, x + 10, y + 14, 3, 3, '#273146');
    box(map, x + 7, y + 17, 9, 1, '#172336');
  }

  function rack(x, y) {
    box(map, x + 4, y + 4, 26, 35, '#142633');
    box(map, x, y, 27, 35, '#172336');
    box(map, x + 2, y + 2, 23, 2, '#647b99');
    for (let row = 0; row < 4; row++) {
      const top = y + 6 + row * 7;
      box(map, x + 3, top, 21, 6, '#354a63');
      box(map, x + 5, top + 2, 11, 1, '#172336');
      box(map, x + 19, top + 2, 2, 2, row === 2 ? '#f9bf73' : '#8fe5ac');
    }
  }

  function plant(x, y) {
    box(map, x - 5, y + 8, 11, 6, '#b97762');
    box(map, x - 6, y + 7, 13, 2, '#d19470');
    box(map, x - 1, y - 6, 3, 14, '#62b69a');
    box(map, x - 6, y - 2, 7, 4, '#3b887c');
    box(map, x + 2, y - 4, 5, 4, '#80c7a0');
    box(map, x + 1, y + 2, 7, 3, '#53a990');
  }

  function drawRoom() {
    box(map, 0, 0, 360, 228, '#e8c39d');
    box(map, 7, 7, 346, 216, '#815a41');
    box(map, 9, 9, 342, 46, '#b9daed');
    box(map, 9, 9, 342, 3, '#e0f0f8');
    box(map, 9, 48, 342, 7, '#a47554');
    box(map, 9, 48, 342, 2, '#ead0ad');
    for (let y = 55; y < 215; y += 8) {
      const stagger = ((y - 55) / 8 % 2) * 22;
      box(map, 10, y, 340, 8, stagger ? '#e3b98e' : '#edc99f');
      box(map, 10, y + 7, 340, 1, '#c79a74');
      for (let x = 32 + stagger; x < 350; x += 44) box(map, x, y, 1, 7, '#cd9f77');
    }
    box(map, 10, 215, 340, 5, '#ad805f');
    windowPane(29);
    windowPane(83);
    windowPane(230);
    windowPane(284);
    box(map, 144, 17, 71, 26, '#9c6e50');
    box(map, 146, 19, 67, 22, '#fff8e9');
    box(map, 152, 24, 25, 2, '#4b87aa');

    team.slice(0, 3).forEach((member) => {

    rug(47, 160, 101, 49);

  }

  function walkingPosition(member, index, animateStride) {
    const walk = walks[index];
    const cycle = (elapsed + index * 1950) % 10500;
    const segmentDuration = 950;
    const walkingTime = cycle - 2200;
    if (walkingTime <= 0 || walkingTime >= (walk.length - 1) * segmentDuration) {
      return { x: member.x, y: member.y, stride: 0 };
    }
    const segment = Math.floor(walkingTime / segmentDuration);
    const progress = (walkingTime % segmentDuration) / segmentDuration;
    const [fromX, fromY] = walk[segment];
    const [toX, toY] = walk[segment + 1];
    const step = Math.floor(walkingTime / 110) % 4;
    return {
      x: Math.round(member.x + fromX + (toX - fromX) * progress),
      y: Math.round(member.y + fromY + (toY - fromY) * progress),
      stride: animateStride ? [0, 1, 0, -1][step] : 0
    };
  }

  function drawOffice(animateStride) {
    scene.drawImage(room, 0, 0);
    team.forEach((member, index) => {
      const { x, y, stride } = elapsed ? walkingPosition(member, index, animateStride) : member;
      if (member === selected) {
        box(scene, x - 12, y + 20, 25, 3, '#236b91');
      }
      sprite(scene, x, y, member, stride);
      const station = stations.get(member);
      station.style.setProperty('--x', (x / room.width * 100) + '%');
      station.style.setProperty('--y', ((y + 32) / room.height * 100) + '%');
    });
  }

  function select(member) {
    selected = member;
    controls.forEach(({ button, owner }) => {
      button.setAttribute('aria-pressed', String(member === owner));
    });
    profile.name.textContent = member.name;
    profile.role.textContent = member.role;
    profile.focus.textContent = member.focus;
    drawPortrait(member);
    drawOffice(false);
  }

  function addControl(member, parent, isStation) {
    const button = document.createElement('button');
    button.type = 'button';
    if (isStation) {
      button.className = 'station';
      stations.set(member, button);
      const label = document.createElement('span');
      label.textContent = member.name;
      button.appendChild(label);
    } else {
      button.textContent = member.name;
    }
    button.setAttribute('aria-label', member.name + ', ' + member.role);
    button.addEventListener('click', () => select(member));
    controls.push({ button, owner: member });
    parent.appendChild(button);
  }

  team.forEach((member) => {
    addControl(member, floor, true);
    addControl(member, roster, false);
  });
  drawRoom();
  select(team[0]);

  function setupMotion() {
    const button = document.getElementById('office-motion');
    const preference = matchMedia('(prefers-reduced-motion: reduce)');
    const interval = 1000 / 15;
    let running = false;
    let frame = 0;
    let lastFrame = null;

    function animate(now) {
      lastFrame ??= now;
      const gap = now - lastFrame;
      if (gap >= interval) {
        elapsed += Math.min(gap, 120);
        lastFrame = now;
        drawOffice(true);
      }
      frame = requestAnimationFrame(animate);
    }

    function setRunning(active) {
      cancelAnimationFrame(frame);
      lastFrame = null;
      running = active;
      button.textContent = active ? 'Pause motion' : 'Play motion';
      if (active) {
        frame = requestAnimationFrame(animate);
      } else {
        drawOffice(false);
      }
    }

    button.hidden = false;
    button.addEventListener('click', () => setRunning(!running));
    preference.addEventListener('change', () => setRunning(!preference.matches));
    setRunning(!preference.matches);
  }

  function setupTasks() {
    const storageKey = 'pmma-it-office.tasks.v1';
    const statuses = { todo: 'To do', doing: 'In progress', done: 'Done' };
    const owners = new Set(['', ...team.map(({ name }) => name)]);
    const form = document.getElementById('task-form');
    const titleInput = document.getElementById('task-title');
    const ownerInput = document.getElementById('task-owner');
    const filter = document.getElementById('task-filter');
    const count = document.getElementById('task-count');
    const message = document.getElementById('task-message');
    const empty = document.getElementById('task-empty');
    const list = document.getElementById('task-list');

    function report(messageText) {
      message.textContent = messageText;
      message.hidden = !messageText;
    }

    function option(value, label) {
      const item = document.createElement('option');
      item.value = value;
      item.textContent = label;
      return item;
    }

    function readTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
        if (!Array.isArray(saved)) return [];
        return saved.filter((task) => task && typeof task.id === 'string' &&
          typeof task.title === 'string' && task.title.length <= 120 &&
          owners.has(task.owner) && Object.hasOwn(statuses, task.status));
      } catch {
        report('Saved tasks could not be loaded.');
        return [];
      }
    }

    ownerInput.append(option('', 'Unassigned'));
    team.forEach(({ name }) => ownerInput.append(option(name, name)));
    let tasks = readTasks();

    function saveTasks() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(tasks));
        report('');
      } catch {
        report('This browser could not save your changes. They will last until you close or reload the page.');
      }
    }

    function renderTasks(focusId) {
      const openCount = tasks.filter(({ status }) => status !== 'done').length;
      count.textContent = openCount + ' open';
      const visible = tasks.filter(({ status }) => filter.value === 'all' || filter.value === status);
      empty.hidden = visible.length > 0;
      empty.textContent = tasks.length ? 'No tasks match this filter.' : 'No tasks yet.';
      list.replaceChildren();
      let focusTarget;
      visible.forEach((task) => {
        const row = document.createElement('li');
        row.className = 'task';
        const title = document.createElement('p');
        title.className = 'task-title';
        title.textContent = task.title;
        const owner = document.createElement('p');
        owner.className = 'task-owner';
        owner.textContent = task.owner || 'Unassigned';
        const details = document.createElement('div');
        details.append(title, owner);
        const status = document.createElement('select');
        status.setAttribute('aria-label', 'Status for ' + task.title);
        Object.entries(statuses).forEach(([value, label]) => status.append(option(value, label)));
        status.value = task.status;
        status.addEventListener('change', () => {
          task.status = status.value;
          saveTasks();
          renderTasks(task.id);
        });
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'task-remove';
        remove.textContent = 'Remove';
        remove.setAttribute('aria-label', 'Remove ' + task.title);
        remove.addEventListener('click', () => {
          tasks = tasks.filter((item) => item.id !== task.id);
          saveTasks();
          renderTasks();
          filter.focus();
        });
        row.append(details, status, remove);
        list.append(row);
        if (task.id === focusId) focusTarget = status;
      });
      if (focusId) (focusTarget || filter).focus({ preventScroll: true });
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const title = titleInput.value.trim();
      if (!title) {
        titleInput.setCustomValidity('Enter a task title.');
        titleInput.reportValidity();
        return;
      }
      tasks.unshift({
        id: globalThis.crypto?.randomUUID?.() || Date.now() + '-' + Math.random().toString(36).slice(2),
        title,
        owner: ownerInput.value,
        status: 'todo'
      });
      filter.value = 'all';
      form.reset();
      saveTasks();
      renderTasks();
      titleInput.focus();
    });
    titleInput.addEventListener('input', () => titleInput.setCustomValidity(''));
    filter.addEventListener('change', () => renderTasks());
    renderTasks();
  }

  function setupFullscreen() {
    const button = document.getElementById('fullscreen');
    if (!document.fullscreenEnabled || !document.documentElement.requestFullscreen) return;
    button.hidden = false;
    button.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      } catch {
        button.hidden = true;
      }
    });
    document.addEventListener('fullscreenchange', () => {
      button.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
    });
  }

  setupMotion();
  setupTasks();
  setupFullscreen();
})();
